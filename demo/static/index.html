<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>논문 RAG 데모 — AI 파트</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#6b7686;
          --line:#e5e8ec; --accent:#3b6ef5; --accept:#1a9c6b; --reject:#c2453d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
         "Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink);
         line-height:1.55; }
  .wrap { max-width:960px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px 20px; margin-bottom:18px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 5px; }
  input[type=text], textarea { width:100%; padding:9px 11px; border:1px solid var(--line);
          border-radius:8px; font:inherit; font-size:14px; background:#fbfcfd; }
  textarea { resize:vertical; min-height:90px; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:10px 20px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .file { font-size:13px; color:var(--muted); }
  .toggle { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  .sec-title { font-size:14px; font-weight:700; margin:0 0 12px;
               display:flex; align-items:center; gap:8px; }
  .pill { font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;
          background:#eef1f6; color:var(--muted); }
  .paper { padding:11px 0; border-top:1px solid var(--line); }
  .paper:first-child { border-top:0; }
  .paper-top { display:flex; gap:10px; align-items:baseline; }
  .rank { color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; min-width:22px; }
  .ptitle { font-weight:600; font-size:14px; flex:1; }
  .meta { font-size:12px; color:var(--muted); margin:2px 0 0 32px; }
  .dec-accept { color:var(--accept); font-weight:600; }
  .dec-reject { color:var(--reject); font-weight:600; }
  .tag { display:inline-block; font-size:11px; background:#eef3ff; color:#2c53c0;
         border-radius:6px; padding:1px 7px; margin:3px 4px 0 0; }
  .paper-top { cursor:pointer; }
  .paper-top:hover .ptitle { color:var(--accent); }
  .chev { color:var(--muted); font-size:11px; width:12px; transition:transform .15s; }
  .paper.open .chev { transform:rotate(90deg); }
  .more-btn { background:none; color:var(--accent); border:1px solid var(--line);
              border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600;
              margin-top:12px; }
  /* --- 상세 패널 (인라인 확장) --- */
  .detail { margin:10px 0 4px 32px; padding:14px 16px; background:#fbfcfd;
            border:1px solid var(--line); border-radius:10px; font-size:13px; }
  .detail h4 { font-size:12px; text-transform:uppercase; letter-spacing:.03em;
               color:var(--muted); margin:14px 0 5px; }
  .detail h4:first-child { margin-top:0; }
  .links a { color:var(--accent); text-decoration:none; font-weight:600; margin-right:14px; }
  .links a:hover { text-decoration:underline; }
  .abs { white-space:pre-wrap; }
  .rev { border-top:1px solid var(--line); padding:10px 0 2px; }
  .rev-head { display:flex; gap:8px; align-items:baseline; font-weight:600; }
  .rev-score { background:#eef3ff; color:#2c53c0; border-radius:6px; padding:1px 7px;
               font-size:12px; }
  .rev-body { white-space:pre-wrap; margin:4px 0 0; }
  .rev-body b { display:block; font-size:12px; color:var(--muted); margin-top:7px; }
  .pt { margin:3px 0; }
  .pt-aspect { display:inline-block; font-size:11px; border-radius:6px; padding:1px 7px;
               margin-right:6px; background:#eef1f6; color:var(--muted); }
  .pt.weakness .pt-aspect { background:#fdecea; color:#a1352d; }
  .pt.strength .pt-aspect { background:#e7f6ef; color:#12744d; }
  .bar-row { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:13px; }
  .bar-label { min-width:150px; }
  .bar-track { flex:1; background:#eef1f6; border-radius:6px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--accent); }
  .bar-count { min-width:52px; text-align:right; color:var(--muted);
               font-variant-numeric:tabular-nums; }
  .ex { font-size:12px; color:var(--muted); margin:3px 0 0 160px; }
  .ex b { color:var(--ink); }
  .ex.risk { color:var(--reject); }
  .star { color:var(--accent); }
  .split { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px;
           background:#fdf0e3; color:#a35b12; margin-left:4px; }
  /* --- 수정 이력 타임라인 --- */
  .rev-list { border-left:2px solid var(--line); margin:8px 0 0 6px; padding-left:14px; }
  .rev-item { position:relative; padding:8px 0; }
  .rev-item::before { content:''; position:absolute; left:-20px; top:14px; width:8px;
                      height:8px; border-radius:50%; background:var(--line); }
  .rev-item.rebuttal::before { background:var(--accent); }
  .rev-when { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .rev-kind { display:inline-block; font-size:11px; font-weight:600; border-radius:6px;
              padding:1px 7px; margin-right:7px; background:#eef1f6; color:var(--muted); }
  .rev-item.rebuttal .rev-kind { background:#eef3ff; color:#2c53c0; }
  .chg { margin:6px 0 0; font-size:13px; }
  .chg-label { font-weight:600; font-size:12px; color:var(--muted); }
  .chg-text { background:#fff; border:1px solid var(--line); border-radius:8px;
              padding:8px 10px; margin-top:4px; line-height:1.7; word-break:break-word; }
  .d-ins { background:#dcf5e7; color:#0d5c3c; border-radius:3px; padding:0 2px; }
  .d-del { background:#fde2e0; color:#8f2f28; border-radius:3px; padding:0 2px;
           text-decoration:line-through; }
  .rev-file { font-size:12px; color:var(--accent); text-decoration:none; font-weight:600;
              margin-left:6px; }
  .rev-file:hover { text-decoration:underline; }
  .warn { margin-top:10px; padding:9px 11px; border-radius:8px; font-size:13px;
          background:#fdf0e3; color:#8a4d10; border:1px solid #f0d8bb; }
  .warn.danger { background:#fdeceb; color:#8f2f28; border-color:#f2c9c5;
                 font-size:14px; font-weight:500; }
  .match { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px;
           background:#eef2fb; color:#3b5ba5; margin-left:6px; cursor:help; }
  .flow { font-size:13px; margin:5px 0; }
  .arrow { color:var(--accent); font-weight:700; }
  .summary { white-space:pre-wrap; font-size:14px; }
  .muted { color:var(--muted); font-size:13px; }
  .spinner { display:inline-block; width:15px; height:15px; border:2px solid #fff;
             border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite;
             vertical-align:-2px; margin-right:7px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err { color:var(--reject); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>논문 RAG — AI 파트 데모</h1>
  <div class="sub">초록을 붙여넣거나 PDF를 올리면 유사 논문 · 리뷰 지적 패턴 · 게재 경향을 보여줍니다.
    <br>※ 시연용 임시 화면 (실제 프론트는 별도).</div>

  <div class="card">
    <label>제목</label>
    <input type="text" id="title" placeholder="예: Graph Neural Networks for Molecular Property Prediction">
    <label>초록</label>
    <textarea id="abstract" placeholder="논문 초록을 붙여넣으세요."></textarea>
    <label>또는 PDF 업로드 <span class="muted">(제목/초록 자동 추출)</span></label>
    <input type="file" id="pdf" accept="application/pdf" class="file">
    <div class="row">
      <button id="go">분석</button>
      <label class="toggle"><input type="checkbox" id="llm"> AI 요약·태깅 사용 <span class="muted">(크레딧 소모)</span></label>
    </div>
    <div class="hint">체크 안 하면 무료 모드로 동작합니다 (요약·태깅은 간이 버전).</div>
  </div>

  <div id="result"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isAccept = d => (d||"").startsWith("accept");
const decClass = d => isAccept(d) ? "dec-accept" : "dec-reject";
const TOP_SHOWN = 5;   // 표시 개수. 분석 모수(hybrid_search top_k=20)와는 별개다.
const MIN_LIFT = 1.25; // clustering.MIN_LIFT와 같은 값 — 문구 분기에만 쓴다.

$("go").onclick = async () => {
  const btn = $("go"), res = $("result");
  const fd = new FormData();
  fd.append("title", $("title").value);
  fd.append("abstract", $("abstract").value);
  fd.append("use_llm", $("llm").checked ? "1" : "0");
  if ($("pdf").files[0]) fd.append("pdf", $("pdf").files[0]);

  btn.disabled = true;
  res.innerHTML = `<div class="card"><span class="spinner"></span>분석 중… (첫 실행은 모델 로드로 수십 초 걸릴 수 있어요)</div>`;
  try {
    const r = await fetch("/api/analyze", { method:"POST", body:fd });
    const data = await r.json();
    if (!r.ok) { res.innerHTML = `<div class="card err">오류: ${esc(data.error||r.status)}</div>`; return; }
    res.innerHTML = render(data);
  } catch (e) {
    res.innerHTML = `<div class="card err">요청 실패: ${esc(String(e))}</div>`;
  } finally { btn.disabled = false; }
};

// 논문별 유사도 점수는 표시하지 않는다 — top-20 코사인 폭이 0.013이라
// 어떤 변환을 써도 1위와 20위가 같은 값이 된다 (§21). 순위 + 매칭 근거로 대체.
const MATCH = {both:["의미+용어","임베딩과 용어 양쪽에서 걸림 — 가장 믿을 만한 매칭"],
               semantic:["의미","접근은 비슷하지만 쓰는 용어가 다름"],
               lexical:["용어","같은 용어를 쓰지만 접근은 다를 수 있음"]};

function paperRow(p) {
  const m = MATCH[p.match_type];
  const badge = m ? ` <span class="match" title="${esc(m[1])}">${m[0]}</span>` : "";
  let h = `<div class="paper" data-pid="${p.paper_id}">
    <div class="paper-top">
      <span class="rank">${p.rank}.</span>
      <span class="chev">▶</span>
      <span class="ptitle">${esc(p.title)}</span>
      <span class="${decClass(p.decision)}">${esc(p.decision)}</span></div>
    <div class="meta">${esc(p.venue)}${badge}`;
  // 점수는 반드시 venue 기준선과 함께 — 척도가 venue마다 달라 원점수만으론 못 읽는다
  if (p.avg_rating != null) {
    const rel = p.rating_vs_venue != null
      ? ` (venue 평균 ${p.rating_vs_venue>=0?'+':''}${p.rating_vs_venue.toFixed(1)})` : '';
    h += ` · <b>${p.avg_rating.toFixed(1)}점</b>${rel} · 리뷰 ${p.rating_count}건`;
    if (p.rating_spread != null && p.rating_spread >= 4)
      h += ` <span class="split" title="리뷰어 점수가 ${p.rating_spread}점 차로 갈렸습니다">의견 갈림</span>`;
  }
  for (const t of (p.tags||[])) h += `<span class="tag">${esc(t.kind)}: ${esc(t.reason)}</span>`;
  h += `</div><div class="detail" hidden></div></div>`;
  return h;
}

// --- 상세 패널 (클릭 시 /api/paper/{id} lazy load) ---
const ASPECT_KO = {
  novelty:"새로움", experimental_scale:"실험 규모", baselines:"베이스라인",
  clarity:"명확성", theoretical_soundness:"이론적 타당성",
  reproducibility:"재현성", related_work:"선행연구", significance:"중요도",
  other:"기타" };

function detailHTML(x) {
  let h = `<div class="links"><a href="${esc(x.openreview_url)}" target="_blank" rel="noopener">OpenReview 원문 ↗</a>
    <a href="${esc(x.pdf_url)}" target="_blank" rel="noopener">PDF ↗</a>`;
  if (x.arxiv_url) h += `<a href="${esc(x.arxiv_url)}" target="_blank" rel="noopener">arXiv ↗</a>`;
  h += `</div>`;

  // 수정 이력은 DB에 없다 — 누르면 OpenReview를 실시간 조회한다 (revisions.py).
  // 매번 자동으로 부르면 상세 열 때마다 외부 API를 20번 때리게 된다.
  h += `<button class="more-btn rev-btn" data-pid="${x.paper_id}">수정 이력 보기</button>
        <div class="rev-box"></div>`;

  if (x.authors.length)
    h += `<h4>저자</h4><div>${x.authors.map(esc).join(', ')}</div>`;
  if (x.keywords.length)
    h += `<div style="margin-top:6px">${x.keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>`;
  if (x.abstract) h += `<h4>초록</h4><div class="abs">${esc(x.abstract)}</div>`;
  if (x.meta_review) h += `<h4>메타 리뷰 (AC 결정문)</h4><div class="abs">${esc(x.meta_review)}</div>`;

  // 리뷰 원문. 2023년 이전 형식은 강/약점이 분리돼 있지 않아 본문을 통째로 보여준다.
  h += `<h4>리뷰 ${x.reviews.length}건</h4>`;
  if (!x.reviews.length) h += `<div class="muted">공개된 리뷰가 없습니다.</div>`;
  x.reviews.forEach((r, i) => {
    h += `<div class="rev"><div class="rev-head"><span>리뷰어 ${i+1}</span>`;
    if (r.rating != null)
      h += `<span class="rev-score">${esc(r.rating_raw || r.rating.toFixed(1)+'점')}</span>`;
    if (r.confidence != null) h += `<span class="muted">확신도 ${r.confidence}</span>`;
    h += `</div><div class="rev-body">`;
    if (r.is_unsplit) {
      h += esc(r.weaknesses || r.summary || '');
    } else {
      if (r.summary)    h += `<b>요약</b>${esc(r.summary)}`;
      if (r.strengths)  h += `<b>강점</b>${esc(r.strengths)}`;
      if (r.weaknesses) h += `<b>약점</b>${esc(r.weaknesses)}`;
      if (r.questions)  h += `<b>질문</b>${esc(r.questions)}`;
    }
    h += `</div></div>`;
  });

  // 추출된 지적 항목. 두 가지를 정직하게 구분해서 보여준다:
  //  1) 미분리 포맷 리뷰에서 나온 항목은 '지적'이 아니라 '본문에서 추출한 문장'이다.
  //     추출기가 리뷰 본문 전체를 weakness로 라벨링하기 때문 (schemas 주석 참고).
  //  2) aspect='other'는 패턴 집계에서 제외되는 버킷이라 기본으로 접어둔다.
  const weak = x.review_points.filter(p => p.sentiment === 'weakness');
  if (weak.length) {
    h += `<h4>추출된 지적 항목</h4>`;
    // 미분리 리뷰에서 왔다면 Cons/Weaknesses 섹션을 되살린 것이다 — 되살리지
    // 못한 리뷰의 문장은 sentiment='unknown'이라 애초에 여기 없다.
    if (weak.some(p => p.from_unsplit_review))
      h += `<div class="muted" style="margin-bottom:6px">강·약점을 나누지 않는 리뷰 형식이라, 본문의 Cons/Weaknesses 섹션에서 복구한 항목이 포함돼 있습니다.</div>`;
    const named = weak.filter(p => p.aspect !== 'other');
    const other = weak.filter(p => p.aspect === 'other');
    for (const p of named)
      h += `<div class="pt weakness"><span class="pt-aspect">${esc(ASPECT_KO[p.aspect]||p.aspect)}</span>${esc(p.text)}</div>`;
    if (other.length) {
      h += `<div id="other-${x.paper_id}" hidden>`;
      for (const p of other)
        h += `<div class="pt"><span class="pt-aspect">미분류</span>${esc(p.text)}</div>`;
      h += `</div><button class="more-btn other-btn" data-target="other-${x.paper_id}">미분류 ${other.length}건 보기</button>`;
      if (!named.length)
        h += `<div class="muted" style="margin-top:6px">분류된 지적이 없습니다 — 키워드 매칭으로 aspect를 판정하는데, 코퍼스 전체의 62%가 미분류로 남습니다.</div>`;
    }
  }

  // 지적인지 확정하지 못한 문장. 약점 섹션 머리말이 없는 미분리 리뷰라
  // 집계에서도 빠져 있다 — 참고용으로만 접어서 보여준다.
  const unknown = x.review_points.filter(p => p.sentiment === 'unknown');
  if (unknown.length) {
    h += `<h4>지적 여부 미확정</h4>`;
    h += `<div class="warn">이 학회는 강점·약점을 나누지 않는 형식인데 'Weaknesses' 같은 머리말도 없어, 아래는 리뷰 본문을 문장 단위로 쪼갠 것입니다. <b>실제 지적이 아닌 문장이 섞여 있어 위 통계에서는 제외했습니다.</b></div>`;
    h += `<div id="unk-${x.paper_id}" hidden>`;
    for (const p of unknown)
      h += `<div class="pt">${esc(p.text)}</div>`;
    h += `</div><button class="more-btn other-btn" data-target="unk-${x.paper_id}">${unknown.length}건 보기</button>`;
  }
  return h;
}

// --- 수정 이력 (저자가 리뷰 받고 뭘 고쳤는지) ---
// 백엔드가 이미 단어 단위 diff를 조각으로 잘라 보내준다 — 여기선 색만 입힌다.
function revisionsHTML(x) {
  if (!x.supported || !x.revisions.length)
    return `<div class="muted" style="margin-top:8px">${esc(x.message||"수정 이력이 없습니다.")}</div>`;

  let h = `<div class="rev-list">`;
  for (const r of x.revisions) {
    h += `<div class="rev-item ${esc(r.kind)}">
      <span class="rev-kind">${esc(r.kind_label)}</span><span class="rev-when">${esc(r.date)}</span>`;
    // 가장 이른 edit은 '그 이전 버전'을 모른다 — 무엇이 바뀌었다고 말할 수 없다.
    if (r.is_baseline)
      h += `<div class="muted" style="margin-top:3px">여기서부터 이력이 공개됩니다 (이전 내용은 비공개).</div>`;
    else if (!r.changes.length)
      h += `<div class="muted" style="margin-top:3px">추적 대상 필드(제목·초록·PDF 등)에는 변경이 없습니다.</div>`;

    for (const c of r.changes) {
      h += `<div class="chg"><span class="chg-label">${esc(c.label)}</span>`;
      if (c.kind === "text" && c.segments.length) {
        h += ` <span class="muted">— 유사도 ${c.similarity}</span><div class="chg-text">`;
        for (const s of c.segments) {
          const cls = s.op === "insert" ? "d-ins" : s.op === "delete" ? "d-del" : "";
          h += cls ? `<span class="${cls}">${esc(s.text)}</span> ` : `${esc(s.text)} `;
        }
        h += `</div>`;
      } else if (c.kind === "file") {
        // 파일은 해시만 바뀌어 내용 비교가 안 된다 — 대신 양쪽 원본을 직접 연다.
        h += ` ${esc(c.after)}`;
        if (c.before_url) h += ` <a class="rev-file" href="${esc(c.before_url)}" target="_blank" rel="noopener">이전본 ↗</a>`;
        if (c.after_url)  h += ` <a class="rev-file" href="${esc(c.after_url)}" target="_blank" rel="noopener">이후본 ↗</a>`;
      } else {
        // after가 null이면 필드가 지워진 것이다 (백엔드 _unwrap의 delete 처리)
        h += ` ${c.after === null ? "삭제됨"
                : c.before ? `<span class="d-del">${esc(c.before)}</span> → <span class="d-ins">${esc(c.after)}</span>`
                : esc(c.after)}`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

async function loadRevisions(btn) {
  const box = btn.nextElementSibling;
  btn.disabled = true;
  box.innerHTML = `<div class="muted" style="margin-top:8px">OpenReview 조회 중…</div>`;
  try {
    const r = await fetch(`/api/paper/${btn.dataset.pid}/revisions`);
    const x = await r.json();
    if (!r.ok) { box.innerHTML = `<span class="err">${esc(x.error||r.status)}</span>`; btn.disabled = false; return; }
    box.innerHTML = revisionsHTML(x);
    btn.remove();
  } catch (e) {
    box.innerHTML = `<span class="err">불러오기 실패: ${esc(String(e))}</span>`;
    btn.disabled = false;
  }
}

async function toggleDetail(row) {
  const box = row.querySelector(".detail");
  if (!row.classList.contains("open")) {
    row.classList.add("open"); box.hidden = false;
    if (!box.dataset.loaded) {
      box.innerHTML = `<span class="muted">불러오는 중…</span>`;
      try {
        const r = await fetch(`/api/paper/${row.dataset.pid}`);
        const x = await r.json();
        box.innerHTML = r.ok ? detailHTML(x)
                             : `<span class="err">${esc(x.error||r.status)}</span>`;
        if (r.ok) box.dataset.loaded = "1";
      } catch (e) {
        box.innerHTML = `<span class="err">불러오기 실패: ${esc(String(e))}</span>`;
      }
    }
  } else { row.classList.remove("open"); box.hidden = true; }
}

$("result").addEventListener("click", e => {
  // 상세 안의 '미분류 N건 보기'가 논문 접기로 오인되지 않도록 먼저 처리한다
  if (e.target.classList.contains("other-btn")) {
    $(e.target.dataset.target).hidden = false;
    e.target.remove();
    return;
  }
  if (e.target.classList.contains("rev-btn")) { loadRevisions(e.target); return; }
  const top = e.target.closest(".paper-top");
  if (top) { toggleDetail(top.parentElement); return; }
  if (e.target.id === "more-btn") {
    $("more-papers").hidden = false;
    e.target.remove();
  }
});

function render(d) {
  let h = "";

  // 쿼리 확인 (PDF 추출 결과 확인용)
  h += `<div class="card"><div class="sec-title">🔍 입력</div>
    <div><b>${esc(d.query_title)||"<span class='muted'>제목 없음</span>"}</b></div>
    <div class="muted" style="margin-top:6px">${esc((d.query_abstract||"").slice(0,300))}${(d.query_abstract||"").length>300?"…":""}</div></div>`;

  // 검색 신뢰도 — 결과를 믿어도 되는지. 신뢰 불가면 목록보다 먼저, 크게 알린다.
  const conf = d.confidence || {};
  if (conf.level && conf.level !== "strong") {
    const cls = conf.is_reliable ? "warn" : "warn danger";
    h += `<div class="card"><div class="${cls}" style="margin-top:0">
      ${conf.is_reliable ? "ℹ️" : "⚠️"} ${esc(conf.message)}</div></div>`;
  }

  // 유사 논문 — 상위 5편만 펼쳐 보여주고 나머지는 접어둔다.
  // 검색·통계는 20편 전부를 쓰지만(리뷰 패턴의 lift·Fisher 검정이 그 모수에 의존),
  // 화면에 20편을 나열하면 정작 읽히지 않는다. 표시 개수와 분석 모수는 별개다.
  const all = d.similar_papers, shown = all.slice(0, TOP_SHOWN), rest = all.slice(TOP_SHOWN);
  h += `<div class="card"><div class="sec-title">📄 유사 논문 <span class="pill">상위 ${shown.length}편</span></div>`;
  if (!all.length) h += `<div class="muted">결과 없음.</div>`;
  else if (rest.length)
    h += `<div class="muted" style="margin:-4px 0 10px">아래 분석은 유사 논문 ${all.length}편 전체를 기준으로 계산됩니다.</div>`;
  h += shown.map(paperRow).join("");
  if (rest.length) {
    h += `<div id="more-papers" hidden>${rest.map(paperRow).join("")}</div>`;
    h += `<button class="more-btn" id="more-btn">나머지 ${rest.length}편 보기</button>`;
  }
  h += `</div>`;

  // 리뷰 점수 맥락 — "몇 점을 받아야 붙는가"
  const rc = d.rating_context || {};
  if (rc.rated_papers) {
    h += `<div class="card"><div class="sec-title">📊 리뷰 점수</div>`;
    h += `<div>유사 논문 ${rc.rated_papers}편의 평균 <b>${rc.neighbor_mean}점</b>`;
    if (rc.accepted_mean != null && rc.rejected_mean != null)
      h += ` — 통과한 논문 ${rc.accepted_mean}점 vs 탈락한 논문 ${rc.rejected_mean}점`;
    h += `</div>`;
    if (rc.threshold != null)
      h += `<div style="margin-top:6px">당락 경계: <b>${esc(rc.threshold_venue)}</b> 기준 평균 <b>${rc.threshold}점</b> 이상이면 통과율 50%를 넘습니다.</div>`;
    if ((rc.split_papers||[]).length) {
      h += `<div class="ex" style="margin-left:0;margin-top:8px">리뷰어 의견이 크게 갈린 논문: `;
      h += rc.split_papers.map(t=>esc(t)).join(' · ');
      h += `</div>`;
    }
    // 표본 편향은 반드시 알린다 — 안 알리면 "NeurIPS가 붙기 쉽다"로 오독된다
    if ((rc.biased_venues||[]).length)
      h += `<div class="warn">⚠️ ${rc.biased_venues.map(esc).join(', ')}는 OpenReview에 <b>채택된 논문 위주로만</b> 공개됩니다. 이 학회의 accept율을 실제 채택률로 해석하지 마세요.</div>`;
    h += `</div>`;
  }

  // 리뷰 지적 패턴 — 빈도가 아니라 '코퍼스 평균 대비 얼마나 두드러지는가'를 보여준다.
  // 그냥 빈도로 줄세우면 baselines(코퍼스 78.8%)가 항상 1등이라 정보가 없다.
  h += `<div class="card"><div class="sec-title">💬 반복되는 리뷰 지적</div>`;
  if (!d.review_patterns.length) h += `<div class="muted">지적 패턴 데이터가 아직 없습니다 (수집 진행 중일 수 있음).</div>`;
  // 분모가 이웃 수보다 작으면 그 이유를 밝힌다 — 미분리 리뷰라 지적을 확정할 수
  // 없는 논문은 분모에서 빠진다 (nodes.review_analysis_node 참고).
  const denom = d.review_patterns[0]?.total_papers;
  if (denom != null && denom < d.similar_papers.length)
    h += `<div class="muted" style="margin-bottom:8px">유사 논문 ${d.similar_papers.length}편 중 <b>${denom}편</b> 기준 — 나머지는 강·약점을 나누지 않는 리뷰 형식이라 지적을 확정할 수 없어 제외했습니다.</div>`;
  const hasLift = d.review_patterns.some(p=>p.lift != null);
  if (hasLift && !d.review_patterns.some(p=>p.is_distinctive))
    h += `<div class="muted" style="margin-bottom:8px">이 주제 특유의 지적은 없습니다 — 아래는 모두 ML 논문 전반의 평균적인 지적 수준입니다.</div>`;
  for (const p of d.review_patterns) {
    const w = (100*p.paper_count/p.total_papers).toFixed(0);
    const star = p.is_distinctive ? `<span class="star" title="코퍼스 평균 대비 유의하게 높음">★</span> ` : '';
    h += `<div class="bar-row">
      <span class="bar-label">${star}${esc(p.label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${w}%"></span></span>
      <span class="bar-count">${p.paper_count}/${p.total_papers}편</span></div>`;
    // 코퍼스 base rate 대비 배수. 1.0 근처면 '어디서나 나오는 지적'이라는 뜻.
    // is_distinctive는 lift와 p값을 둘 다 요구하므로(clustering.MIN_LIFT/MAX_P_VALUE),
    // false라고 해서 '평균 수준'인 건 아니다 — lift는 큰데 n=20이라 검정을 못 넘긴
    // 경우와 진짜로 평균인 경우를 구분해서 쓴다.
    if (p.lift != null) {
      let note = '';
      if (!p.is_distinctive)
        note = p.lift >= MIN_LIFT
          ? ` — 표본이 작아 판단 보류 (p=${p.p_value})`
          : ' — 평균 수준';
      h += `<div class="ex">코퍼스 평균 ${(100*p.base_rate).toFixed(0)}% 대비 <b>${p.lift.toFixed(2)}배</b>${note}</div>`;
    }
    // 당락 대조는 유의할 때만 단정한다. 표본이 작으면(이웃 20편 중 4편 등) 노이즈다.
    if (p.is_contrast_significant)
      h += `<div class="ex risk">이 지적을 받은 ${p.decided_with}편 중 ${p.accept_with}편만 통과(${(100*p.accept_rate_with).toFixed(0)}%) · 지적이 없던 ${p.decided_without}편은 ${(100*p.accept_rate_without).toFixed(0)}% 통과</div>`;
    if (p.examples && p.examples[0]) h += `<div class="ex">예: ${esc(p.examples[0].text)}</div>`;
  }
  h += `</div>`;

  // 게재 경향
  h += `<div class="card"><div class="sec-title">🏛️ 게재 경향</div>`;
  if (!d.venue_trends.length) h += `<div class="muted">데이터 없음.</div>`;
  for (const t of d.venue_trends) {
    const w = (100*t.accept_rate).toFixed(0);
    h += `<div class="bar-row">
      <span class="bar-label">${esc(t.venue)}${t.is_coverage_biased?' <span class="split">표본편향</span>':''}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${w}%;background:var(--accept)"></span></span>
      <span class="bar-count">${t.accept_count}/${t.paper_count} (${w}%)</span></div>`;
    // 절대 accept율은 코퍼스 기준선 없이는 의미가 없다 (특히 편향 venue)
    if (t.accept_lift != null)
      h += `<div class="ex">이 학회 코퍼스 평균 ${(100*t.corpus_accept_rate).toFixed(0)}% 대비 <b>${t.accept_lift.toFixed(2)}배</b>${t.is_coverage_biased?' — 절대 채택률로 읽지 말 것':''}</div>`;
  }
  // 재투고 흐름
  if (d.resubmission_flows && d.resubmission_flows.length) {
    h += `<div style="margin-top:12px"><div class="muted" style="margin-bottom:6px">재투고 흐름</div>`;
    for (const f of d.resubmission_flows)
      h += `<div class="flow">${esc(f.from_venue)} <span class="arrow">→</span> ${esc(f.to_venue)} <span class="muted">${f.count}건</span></div>`;
    h += `</div>`;
  }
  h += `</div>`;

  // 종합 요약
  if (d.summary_markdown) {
    h += `<div class="card"><div class="sec-title">📝 종합</div><div class="summary">${esc(d.summary_markdown)}</div>`;
    // 근거 추적: 요약이 인용한 [E1]/[M1]이 실제 어떤 문장인지 펼쳐 보여준다.
    // 검증을 통과한 라벨만 citations에 남으므로 여기 있는 건 전부 실재하는 원문이다.
    const cited = (d.citations || []);
    const pool = (d.evidence || []).filter(e => cited.includes(e.label));
    if (pool.length) {
      h += `<div class="sec-title" style="margin-top:14px">🔗 인용된 근거</div>`;
      for (const e of pool) {
        const kind = e.kind === 'meta_review' ? 'AC 총평' : '리뷰 지적';
        h += `<div class="ex"><b>[${esc(e.label)}]</b> <span class="muted">${kind} · ${esc(e.paper_title)}</span><br>${esc(e.text)}</div>`;
      }
    }
    h += `</div>`;
  }

  return h;
}
